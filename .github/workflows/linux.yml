# NextVPN for Linux: tests, a real connection to the Psiphon network, and the
# packages for every supported distribution. A v*-linux tag also publishes them
# as a GitHub release. The Windows build is not involved.
name: Linux

on:
  pull_request:
    paths:
      - "linux/**"
      - "engine/**"
      - "meson.build"
      - "meson_options.txt"
      - "flake.nix"
      - ".github/workflows/linux.yml"
  push:
    tags:
      - "v*-linux"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gsettings-desktop-schemas \
            meson ninja-build gettext desktop-file-utils appstream dbus
      - name: Unit tests, desktop file, metainfo
        run: |
          meson setup _build
          dbus-run-session -- meson test -C _build --print-errorlogs
      - name: The real engine starts and stops
        working-directory: linux
        run: NEXTVPN_REAL_ENGINE_TEST=1 python3 -m unittest -v tests.test_engine.RealEngineSmokeTest

  connect:
    name: Connects to the Psiphon network
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Connect and carry traffic, best performance
        run: python3 linux/tools/connect-check.py --timeout 240
      - name: Connect and carry traffic, exit in Germany
        run: python3 linux/tools/connect-check.py --timeout 240 --region DE

  tarball:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && linux/packaging/make-tarball.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*

  deb:
    name: Ubuntu / Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gettext dpkg-dev
      - name: Build
        run: mkdir dist && linux/packaging/debian/build-deb.sh dist
      - name: Install and run
        run: |
          sudo apt-get install -y ./dist/nextvpn_*_amd64.deb
          nextvpn --version
          test -x /usr/libexec/nextvpn/psiphon-tunnel-core
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: Fedora package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build meson gettext python3 desktop-file-utils appstream gtk4-devel glib2-devel \
            python3-gobject python3-cairo gtk4 libadwaita gsettings-desktop-schemas tar gzip
      - name: Build
        run: linux/packaging/fedora/build-rpm.sh
      - name: Install and run
        run: |
          mkdir dist
          for f in ~/rpmbuild/RPMS/x86_64/nextvpn-*.rpm; do
            # Without the dist tag, so the download link does not change with each Fedora release.
            cp "$f" "dist/$(basename "$f" | sed 's/\.fc[0-9]*\././')"
          done
          dnf install -y ./dist/nextvpn-*.rpm
          nextvpn --version
          test -x /usr/libexec/nextvpn/psiphon-tunnel-core
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: Arch / CachyOS package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel meson gettext python python-gobject python-cairo \
            gtk4 libadwaita gsettings-desktop-schemas hicolor-icon-theme desktop-file-utils appstream
      - name: Build
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/linux/packaging/arch' && makepkg --noconfirm"
      - name: Install and run
        run: |
          mkdir dist
          cp linux/packaging/arch/nextvpn-*.pkg.tar.zst dist/
          pacman -U --noconfirm dist/nextvpn-*.pkg.tar.zst
          nextvpn --version
          test -x /usr/lib/nextvpn/psiphon-tunnel-core
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the package
        run: nix build .#nextvpn -L
      - name: Run it
        run: ./result/bin/nextvpn --version
      - name: Build the engine from source, as on aarch64
        run: |
          nix build -L --impure --expr \
            '(builtins.getFlake (toString ./.)).packages.x86_64-linux.psiphon-tunnel-core.override { fromSource = true; }'
          ./result/bin/psiphon-tunnel-core -v
      - name: Flake check
        run: nix flake check --all-systems --no-build

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, connect, tarball, deb, rpm, arch, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n "s/^ *version: '\(.*\)',/\1/p" meson.build)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: NextVPN ${{ steps.version.outputs.version }} для Linux
          body_path: linux/packaging/release-notes.md
          files: dist/*
          # The Windows download links in README.md point at the latest
          # release, so that one stays the Windows release.
          make_latest: false
