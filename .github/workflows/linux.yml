# NextVPN for Linux: tests, real connections to the Psiphon network in both
# modes, the engine checked against its source, and the packages for every
# supported distribution. A v*-linux tag also publishes them
# as a GitHub release. The Windows build is not involved.
name: Linux

on:
  pull_request:
    paths:
      - "linux/**"
      - "engine/**"
      - "meson.build"
      - "meson_options.txt"
      - "flake.nix"
      - ".github/workflows/linux.yml"
  push:
    tags:
      - "v*-linux"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag, created on the commit this runs on (for example v1.0.0-linux). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gsettings-desktop-schemas \
            meson ninja-build gettext desktop-file-utils appstream dbus xvfb
      - name: Unit tests, desktop file, metainfo
        run: |
          meson setup _build
          NEXTVPN_DESKTOP_TESTS=1 xvfb-run -a dbus-run-session -- meson test -C _build --print-errorlogs
      - name: The real engine starts and stops
        working-directory: linux
        run: NEXTVPN_REAL_ENGINE_TEST=1 python3 -m unittest -v tests.test_engine.RealEngineSmokeTest

  engine:
    name: The bundled engine is built from its source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild it and compare
        run: |
          linux/tools/build-engine.sh "" "$RUNNER_TEMP/psiphon-tunnel-core"
          sha256sum linux/engine/psiphon-tunnel-core-x86_64 "$RUNNER_TEMP/psiphon-tunnel-core"
          cmp linux/engine/psiphon-tunnel-core-x86_64 "$RUNNER_TEMP/psiphon-tunnel-core"

  connect:
    name: Connects to the Psiphon network
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Connect and carry traffic, best performance
        run: python3 linux/tools/connect-check.py --timeout 240 --regions-wait 30
      - name: Connect and carry traffic, exit in Germany
        run: python3 linux/tools/connect-check.py --timeout 240 --region DE

  vpn:
    name: Whole-system VPN through NetworkManager
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # NetworkManager only lets a user with a session own a profile, as on a
      # desktop; a login shell gives the runner user one.
      AS_USER: sudo su -l runner -c
    steps:
      - uses: actions/checkout@v4
      - name: NetworkManager, managing nothing but the VPN interface
        run: |
          # Written before the package is installed: NetworkManager starts as
          # soon as it is, and must never touch the runner's own network.
          sudo mkdir -p /etc/NetworkManager/conf.d
          printf '[main]\ndns=systemd-resolved\n[keyfile]\nunmanaged-devices=*,except:interface-name:nextvpn0\n' |
            sudo tee /etc/NetworkManager/conf.d/99-nextvpn-ci.conf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends network-manager dnsutils
          # On a desktop, polkit lets the user of the active session manage
          # their own profiles. The runner has no such session; this grants the
          # same and nothing more.
          printf '%s\n' 'polkit.addRule(function(action, subject) {' \
            '  if (action.id.indexOf("org.freedesktop.NetworkManager.") == 0 && subject.user == "runner")' \
            '    return polkit.Result.YES;' '});' | sudo tee /etc/polkit-1/rules.d/50-nextvpn-ci.rules
          sudo systemctl restart polkit
          sudo systemctl restart NetworkManager
          nmcli general
      - name: Every program's traffic and DNS go through the tunnel, and nothing is left after
        run: $AS_USER "cd '$GITHUB_WORKSPACE' && python3 linux/tools/connect-check.py --vpn --timeout 240"
      - name: The same with the exit in Germany
        run: $AS_USER "cd '$GITHUB_WORKSPACE' && python3 linux/tools/connect-check.py --vpn --timeout 240 --region DE"
      - name: Strict reverse-path filtering, as NixOS's firewall does by default
        run: |
          sudo sysctl -w net.ipv4.conf.all.rp_filter=1 net.ipv4.conf.eth0.rp_filter=1
          sudo iptables -t raw -I PREROUTING -m rpfilter --invert -j DROP
          sudo ip6tables -t raw -I PREROUTING -m rpfilter --invert -j DROP
          $AS_USER "cd '$GITHUB_WORKSPACE' && python3 linux/tools/connect-check.py --vpn --timeout 240"
          sudo iptables -t raw -L PREROUTING -v -n
      - name: A killed app still gives the network back
        run: |
          $AS_USER "cd '$GITHUB_WORKSPACE' && exec python3 linux/tools/connect-check.py --vpn --timeout 240 --hold 900" \
            > "$RUNNER_TEMP/hold.log" 2>&1 &
          for i in $(seq 240); do grep -q '^holding' "$RUNNER_TEMP/hold.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/hold.log"
          grep -q '^holding' "$RUNNER_TEMP/hold.log"
          # The app, not the shell that started it: kill -9 runs no cleanup at all.
          app=$(pgrep -u runner -f '^python3 linux/tools/connect-check.py --vpn')
          sudo kill -KILL $app
          for i in $(seq 30); do
            sudo python3 linux/tools/connect-check.py --check-clean && break
            sleep 1
          done
          sudo python3 linux/tools/connect-check.py --check-clean
          curl -sS --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc)='

  tarball:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && linux/packaging/make-tarball.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: dist/*

  deb:
    name: Ubuntu / Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build gettext dpkg-dev
      - name: Build
        run: mkdir dist && linux/packaging/debian/build-deb.sh dist
      - name: Install and run
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/nextvpn_*_amd64.deb
          nextvpn --version
          test -x /usr/libexec/nextvpn/psiphon-tunnel-core
          # The VPN helper runs from the installed package, as the app starts it.
          PYTHONPATH=/usr/share/nextvpn python3 -m nextvpn.core.vpn_helper 2>&1 | grep -q '^usage:'
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    name: Fedora package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y rpm-build meson gettext python3 desktop-file-utils appstream gtk4-devel glib2-devel \
            python3-gobject python3-cairo gtk4 libadwaita gsettings-desktop-schemas tar gzip
      - name: Build
        run: linux/packaging/fedora/build-rpm.sh
      - name: Install and run
        run: |
          mkdir dist
          for f in ~/rpmbuild/RPMS/x86_64/nextvpn-*.rpm; do
            # Without the dist tag, so the download link does not change with each Fedora release.
            cp "$f" "dist/$(basename "$f" | sed 's/\.fc[0-9]*\././')"
          done
          dnf install -y ./dist/nextvpn-*.rpm
          nextvpn --version
          test -x /usr/libexec/nextvpn/psiphon-tunnel-core
          # The VPN helper runs from the installed package, as the app starts it.
          PYTHONPATH=/usr/share/nextvpn python3 -m nextvpn.core.vpn_helper 2>&1 | grep -q '^usage:'
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  arch:
    name: Arch / CachyOS package
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel meson gettext python python-gobject python-cairo \
            gtk4 libadwaita gsettings-desktop-schemas hicolor-icon-theme desktop-file-utils appstream
      - name: Build
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/linux/packaging/arch' && makepkg --noconfirm"
      - name: Install and run
        run: |
          mkdir dist
          cp linux/packaging/arch/nextvpn-*.pkg.tar.zst dist/
          pacman -U --noconfirm dist/nextvpn-*.pkg.tar.zst
          nextvpn --version
          test -x /usr/lib/nextvpn/psiphon-tunnel-core
          # The VPN helper runs from the installed package, as the app starts it.
          PYTHONPATH=/usr/share/nextvpn python3 -m nextvpn.core.vpn_helper 2>&1 | grep -q '^usage:'
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the package
        run: nix build .#nextvpn -L
      - name: Run it
        run: ./result/bin/nextvpn --version
      - name: Build the engine from source, as on aarch64
        run: |
          nix build -L --impure --expr \
            '(builtins.getFlake (toString ./.)).packages.x86_64-linux.psiphon-tunnel-core.override { fromSource = true; }'
          ./result/bin/psiphon-tunnel-core -v
      - name: Build through the overlay, as from a system's own nixpkgs
        run: |
          nix build -L --impure --out-link result-overlay --expr '
            let f = builtins.getFlake (toString ./.);
            in (import f.inputs.nixpkgs { system = "x86_64-linux"; overlays = [ f.overlays.default ]; }).nextvpn'
          ./result-overlay/bin/nextvpn --version
      - name: Evaluate a NixOS system with the module
        run: |
          nix eval --impure --raw --expr '
            let
              f = builtins.getFlake (toString ./.);
              lib = f.inputs.nixpkgs.lib;
            in
            (lib.nixosSystem {
              modules = [
                f.nixosModules.default
                {
                  nixpkgs.hostPlatform = "x86_64-linux";
                  programs.nextvpn.enable = true;
                  networking.networkmanager.enable = true;
                  boot.loader.grub.enable = false;
                  fileSystems."/" = { device = "nodev"; fsType = "tmpfs"; };
                  system.stateVersion = lib.trivial.release;
                }
              ];
            }).config.system.build.toplevel.drvPath'
      - name: Flake check
        run: nix flake check --all-systems --no-build

  release:
    name: Publish release
    # A pushed v*-linux tag, or a manual run that names the tag to create.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, engine, connect, vpn, tarball, deb, rpm, arch, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n "s/^ *version: '\(.*\)',/\1/p" meson.build)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag does not exist yet: the release creates it
          # on the commit this run built.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NextVPN ${{ steps.version.outputs.version }} для Linux
          body_path: linux/packaging/release-notes.md
          files: dist/*
          # The Windows download links in README.md point at the latest
          # release, so that one stays the Windows release.
          make_latest: false
