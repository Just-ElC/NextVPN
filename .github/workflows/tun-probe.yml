# TEMPORARY: packet tunnel experiment, removed before merge.
name: TUN probe
on:
  push:
    branches: [claude/peaceful-franklin-wrd6x0]
    paths: [".github/workflows/tun-probe.yml", "linux/tools/tun-probe.sh"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends dnsutils >/dev/null
      - run: bash linux/tools/tun-probe.sh
